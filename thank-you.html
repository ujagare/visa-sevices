<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You - White Wings Visa Consultancy</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .thank-you-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
      }

      .thank-you-card {
        background: white;
        padding: 60px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 500px;
        width: 100%;
      }

      .success-icon {
        width: 80px;
        height: 80px;
        background: #4caf50;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 30px;
        font-size: 40px;
        color: white;
      }

      .thank-you-card h1 {
        color: #333;
        margin-bottom: 20px;
        font-size: 2.5rem;
      }

      .thank-you-card p {
        color: #666;
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .btn-home {
        background: #667eea;
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 50px;
        font-size: 1.1rem;
        text-decoration: none;
        display: inline-block;
        transition: all 0.3s ease;
      }

      .btn-home:hover {
        background: #5a6fd8;
        transform: translateY(-2px);
      }

      .contact-info {
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid #eee;
      }

      .contact-info h3 {
        color: #333;
        margin-bottom: 15px;
      }

      .contact-details {
        color: #666;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="thank-you-container">
      <div class="thank-you-card">
        <div class="success-icon">✓</div>

        <h1>Thank You!</h1>

        <p>
          Your message has been successfully sent to White Wings Visa
          Consultancy. Our expert team will review your inquiry and get back to
          you within 24 hours.
        </p>

        <a href="index.html" class="btn-home">Back to Home</a>

        <div class="contact-info">
          <h3>Need Immediate Assistance?</h3>
          <div class="contact-details">
            <p><strong>Call:</strong> +91 9130448831</p>
            <p><strong>Email:</strong> mrunal@whitewingsvisa.com</p>
            <p><strong>Office:</strong> Pune, Maharashtra</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Auto redirect after 10 seconds
      setTimeout(function () {
        window.location.href = "index.html";
      }, 10000);
    </script>
  </body>
</html>
